[project]
name = "mactree"
version = "0.1.0"
description = "Browser-based WinDirStat-like disk usage analyzer with multi-threaded scanning"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
mactree = "mactree.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mactree = ["static/*"]

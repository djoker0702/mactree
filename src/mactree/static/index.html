<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MacTree — disk usage</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="logo">🌳</span> MacTree</div>
    <form id="scan-form">
      <input id="path-input" type="text" spellcheck="false"
             placeholder="/path/to/scan" autocomplete="off" />
      <button id="scan-btn" type="submit">Scan</button>
    </form>
    <div class="view-toggle">
      <button data-view="treemap" class="active">Treemap</button>
      <button data-view="sunburst">Sunburst</button>
    </div>
    <button id="clean-btn" class="clean-btn" disabled>🧹 Clean</button>
  </header>

  <div id="status" class="status"></div>

  <nav id="breadcrumbs" class="breadcrumbs"></nav>

  <div class="workspace">
    <main id="chart"></main>

    <aside id="inspector" class="inspector">
      <div class="insp-empty">Hover or click a region to inspect it.</div>
    </aside>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <!-- Cleanup modal -->
  <div id="clean-overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clean-title">
      <div class="modal-head">
        <div id="clean-title">🧹 Residual dev artifacts</div>
        <button id="clean-close" class="icon-btn" title="Close">✕</button>
      </div>
      <div id="clean-summary" class="modal-summary"></div>
      <div id="clean-list" class="clean-list"></div>
      <div class="modal-foot">
        <label class="select-all"><input type="checkbox" id="clean-all" /> select all</label>
        <div class="foot-right">
          <span id="clean-selected" class="clean-selected"></span>
          <button id="clean-delete" class="danger-btn" disabled>Delete selected</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
